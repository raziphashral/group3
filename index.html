    <script>
      // Gracefully prevent cross-origin third-party script errors (e.g., Clarity or Disqus in sandboxed iframes)
      // from generating unhandled "Script error." alerts
      window.addEventListener('error', function(event) {
        if (
          event.message === 'Script error.' ||
          (typeof event.message === 'string' && event.message.includes('Script error')) ||
          (event.filename && (event.filename.includes('clarity.ms') || event.filename.includes('disqus.com')))
        ) {
          event.stopImmediatePropagation?.();
          event.preventDefault?.();
          return true;
        }
      }, true);

      window.onerror = function(message, source) {
        if (
          message === 'Script error.' ||
          (typeof message === 'string' && message.includes('Script error')) ||
          (source && (source.includes('clarity.ms') || source.includes('disqus.com')))
        ) {
          return true;
        }
      };
    </script>
